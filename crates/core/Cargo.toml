[package]
name = "voicedoc-core"
version = "0.1.0"
edition = "2021"
description = "VoiceDoc 핵심 라이브러리: 오디오 디코딩, 음성 인식, 문서 내보내기, 온라인 AI"

[features]
default = ["local-stt"]
local-stt = ["dep:whisper-rs", "dep:memmap2"]

[dependencies]
symphonia = { version = "0.5.4", default-features = false, features = ["mp3", "aac", "isomp4", "wav", "flac", "ogg", "vorbis", "pcm", "alac", "adpcm", "mkv"] }
rubato = "0.16"
whisper-rs = { version = "0.14", optional = true }
memmap2 = { version = "0.9", optional = true }
docx-rs = "0.4"
printpdf = "0.7"
lopdf = "0.31"
ttf-parser = "0.25"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tiny_http = "0.12"
tempfile = "3"

[[bin]]
name = "voicedoc-cli"
path = "src/bin/voicedoc-cli.rs"
