name: 윈도 설치 파일 빌드

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    env:
      # Vulkan 셰이더 생성 단계가 폴더를 깊게 만들어 윈도 경로 길이 제한(260자)을 넘는다.
      # 빌드 폴더를 짧은 경로에 둔다.
      CARGO_TARGET_DIR: C:\t
      # 인식 엔진(whisper.cpp)은 기본으로 "빌드하는 PC의 CPU"에 맞춰 컴파일된다. 빌드 서버에 AVX-512가 있으면
      # AVX-512가 없는 사용자 PC(인텔 12~14세대 코어 등)에서 CPU 인식 중 프로그램이 꺼진다.
      # 그래서 AVX2(+FMA, F16C, BMI2)까지만 쓰도록 고정한다. whisper-rs-sys가 GGML_* 환경 변수를 CMake로 넘긴다.
      GGML_NATIVE: "OFF"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> C:\\t"

      # whisper.cpp 바인딩 생성에 libclang이 필요하다 (러너에 LLVM이 설치되어 있다).
      - name: LLVM 경로 설정
        shell: pwsh
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      # 그래픽카드 가속(Vulkan) 빌드에 필요한 헤더·셰이더 컴파일러·링크 라이브러리.
      # 앱 실행에는 필요 없다 (vulkan-1.dll은 사용자 PC의 그래픽 드라이버가 설치한다).
      - name: Vulkan SDK 설치
        uses: jakoch/install-vulkan-sdk-action@v1.8.1
        with:
          cache: true

      - run: npm ci

      - name: 핵심 라이브러리 테스트
        run: cargo test -p voicedoc-core --release

      # 빌드 서버의 CPU와, 엔진에 실제로 켜진 명령어를 기록한다 (AVX512 = 0 이어야 한다).
      - name: 인식 엔진 CPU 명령어 확인
        shell: pwsh
        run: |
          (Get-CimInstance Win32_Processor).Name
          cargo run --release -p voicedoc-core --bin voicedoc-cli -- --system-info
          $info = cargo run -q --release -p voicedoc-core --bin voicedoc-cli -- --system-info | Out-String
          if ($info -match "AVX512 = 1") { throw "엔진이 AVX-512를 쓰도록 빌드되었습니다" }

      - name: 설치 파일 빌드
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceDoc-windows
          path: C:\t\release\bundle\nsis\*.exe
          if-no-files-found: error
