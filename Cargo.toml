[workspace]
resolver = "2"
members = ["crates/core", "src-tauri"]
exclude = ["vendor"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# 디버그 빌드에서도 디코딩/인식이 느리지 않도록 의존성은 최적화
[profile.dev.package."*"]
opt-level = 3

# whisper.cpp 바인딩에 작은 수정을 더한 사본 (vendor/README.md 참고):
# Vulkan을 쓸 수 없는 PC에서 앱이 종료되지 않고 CPU로 동작하게 한다.
[patch.crates-io]
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }
